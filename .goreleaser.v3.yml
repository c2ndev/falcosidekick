version: 2

project_name: falcosidekick-v3

env:
  - GO111MODULE=on
  - DOCKER_CLI_EXPERIMENTAL=enabled
  - DOCKER_BUILDKIT=1
  - BUILDX_PLATFORMS=linux/amd64,linux/arm64
  - COSIGN_YES=true

snapshot:
  version_template: "v3-latest"

checksum:
  name_template: "falcosidekick-v3-checksums.txt"

before:
  hooks:
    - go mod tidy
    - /bin/bash -c 'cd ui && ${HOME}/.bun/bin/bun install --frozen-lockfile'
    - /bin/bash -c 'cd ui && ${HOME}/.bun/bin/bun run build'
    - /bin/bash -c 'if [ -n "$(git --no-pager diff --exit-code go.mod go.sum)" ]; then exit 1; fi'

sboms:
  - artifacts: archive

builds:
  - id: falcosidekick-v3
    binary: falcosidekick-v3
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=builtinui
    ldflags:
      - "{{ .Env.LDFLAGS }}"

  - id: falcosidekick-v3-slim
    binary: falcosidekick-v3-slim
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - "{{ .Env.LDFLAGS }}"

archives:
  - id: falcosidekick-v3
    ids:
      - falcosidekick-v3
    name_template: "falcosidekick-v3_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: falcosidekick-v3-slim
    ids:
      - falcosidekick-v3-slim
    name_template: "falcosidekick-v3_{{ .Version }}_{{ .Os }}_{{ .Arch }}_slim"

dockers_v2:
  - id: falcosidekick-v3-ui
    dockerfile: Dockerfile.v3
    ids:
      - falcosidekick-v3
    platforms:
      - linux/amd64
      - linux/arm64
    images:
      - "ghcr.io/c2ndev/falcosidekick"
    tags:
      - "v3-{{ .Version }}"
      - "v3-latest"
    build_args_templates:
      - "BINARY=falcosidekick-v3"
      - "VARIANT=ui"
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.name": "falcosidekick-v3"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "io.falcosecurity.falcosidekick.variant": "ui"
    extra_files:
      - LICENSE

  - id: falcosidekick-v3-slim
    dockerfile: Dockerfile.v3
    ids:
      - falcosidekick-v3-slim
    platforms:
      - linux/amd64
      - linux/arm64
    images:
      - "ghcr.io/c2ndev/falcosidekick"
    tags:
      - "v3-{{ .Version }}-slim"
      - "v3-latest-slim"
    build_args_templates:
      - "BINARY=falcosidekick-v3-slim"
      - "VARIANT=slim"
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.name": "falcosidekick-v3"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "io.falcosecurity.falcosidekick.variant": "slim"
    extra_files:
      - LICENSE

signs:
  - id: falcosidekick-v3
    signature: "${artifact}.bundle"
    cmd: cosign
    args: ["sign-blob", "--bundle", "${artifact}.bundle", "${artifact}"]
    artifacts: archive
  - id: checksum
    signature: "${artifact}.bundle"
    cmd: cosign
    args: ["sign-blob", "--bundle", "${artifact}.bundle", "${artifact}"]
    artifacts: checksum

docker_signs:
  - id: falcosidekick-v3
    cmd: cosign
    args: ["sign", "--recursive", "${artifact}"]
    artifacts: manifests
    output: true

release:
  github:
    owner: c2ndev
    name: falcosidekick
  prerelease: auto
  name_template: "falcosidekick v3 {{ .Version }}"
