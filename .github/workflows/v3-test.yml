name: v3-tests

on:
  workflow_dispatch:
  push:
    branches:
      - development
    tags:
      - "v3.*"
  pull_request:
    branches:
      - development

permissions: {}

jobs:
  v3-unit-tests:
    name: v3 Go + UI tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26'
          cache: false
          check-latest: true

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: '1.3'

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Lint UI
        working-directory: ui
        run: bun run lint

      - name: Typecheck UI
        working-directory: ui
        run: bun run typecheck

      - name: Build UI
        working-directory: ui
        run: bun run build

      - name: Run v3 Go tests (default build)
        run: go test -race -count=1 ./internal/... ./cmd/... ./ui

      - name: Run v3 Go tests (-tags=builtinui)
        run: go test -race -count=1 -tags=builtinui ./internal/... ./cmd/... ./ui

      - name: v3 coverage (touched packages)
        run: |
          go test -cover ./internal/api ./cmd/falcosidekick ./ui | tee /tmp/v3-cov.txt
          grep -E "coverage: [0-9]+\.[0-9]+%" /tmp/v3-cov.txt || exit 1
